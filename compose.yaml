services:
  backup:
    image: ${BACKUP_IMAGE:-registry.cn-hangzhou.aliyuncs.com/sxxpqp/mysql-s3-backup:latest}
    env_file:
      - path: .env
        format: raw
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    volumes:
      - backup-tmp:/tmp
volumes:
  backup-tmp:
