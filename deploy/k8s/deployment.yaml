apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-s3-backup
  namespace: backup
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql-s3-backup
  template:
    metadata:
      labels:
        app: mysql-s3-backup
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      imagePullSecrets:
        - name: registry-credentials
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backup
          image: registry.cn-hangzhou.aliyuncs.com/sxxpqp/mysql-s3-backup:latest
          imagePullPolicy: Always
          # 提前从项目根目录的 .env 创建运行参数 Secret / Create the runtime Secret before deployment:
          # kubectl create namespace backup --dry-run=client -o yaml | kubectl apply -f -
          # kubectl -n backup create secret generic mysql-s3-backup-env --from-env-file=.env --dry-run=client -o yaml | kubectl apply -f -
          # Secret 必须与 Deployment 位于同一 namespace / Secret must be in the same namespace.
          envFrom:
            - secretRef:
                name: mysql-s3-backup-env
          env:
            - name: BACKUP_INTERVAL
              value: "0 2 * * *"
            - name: BACKUP_TIMEZONE
              value: "Asia/Shanghai"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 12Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 10Gi
