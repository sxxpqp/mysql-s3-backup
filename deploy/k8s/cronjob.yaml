apiVersion: batch/v1
kind: CronJob
metadata:
  name: mysql-s3-backup
  namespace: backup
spec:
  schedule: "0 2 * * *"
  timeZone: Asia/Shanghai
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7500
      template:
        metadata:
          labels:
            app: mysql-s3-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/arch: amd64
          imagePullSecrets:
            - name: registry-credentials
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              # Replace with the same image used by Docker. Prefer a fixed commit tag.
              image: registry.example.com/namespace/mysql-s3-backup:76c89e07ac3c3d39435bca1fb565569e1f274074
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: mysql-s3-backup-env
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                  ephemeral-storage: 1Gi
                limits:
                  cpu: "1"
                  memory: 512Mi
                  ephemeral-storage: 12Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 10Gi
